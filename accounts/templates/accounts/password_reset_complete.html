{% extends "base.html" %}

{% block title %}Password updated — OpenQuest{% endblock %}

{% block content %}
<main class="password-message">
    <span class="password-message-mark" aria-hidden="true">✳</span>
    <span class="eyebrow"><span class="eyebrow-dot"></span> All set</span>
    <h1>You’re back <em>in.</em></h1>
    <p>Your password has been updated. Log in and get back to what you were working on.</p>
    <a href="{% url 'login' %}" class="button button-lime">Log in to OpenQuest <span aria-hidden="true">↗</span></a>
</main>
{% endblock %}
